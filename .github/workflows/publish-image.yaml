name: Publish image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Komodo's Stack webhook checks a GitHub-style signature (HMAC-SHA256 of the
      # body) and the pushed branch in "ref", then deploys the Stack.
      - name: Tell Komodo to deploy
        env:
          KOMODO_WEBHOOK: ${{ secrets.KOMODO_WEBHOOK }}
          KOMODO_TOKEN: ${{ secrets.KOMODO_TOKEN }}
        run: |
          body="{\"ref\":\"$GITHUB_REF\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$KOMODO_TOKEN" -r | cut -d' ' -f1)
          curl --fail-with-body --silent --show-error -X POST "$KOMODO_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data "$body"
